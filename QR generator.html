<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No-JS QR Generator (Fixed)</title>
<style>
  :root{
    --bg1:#0b1020; --bg2:#0f172a; --card:#0d1329; --ink:#e5e7eb; --muted:#9fb0ca;
    --accent:#60a5fa; --border:#1f2a4a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(120deg,var(--bg1),var(--bg2));
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .wrap{width:100%; max-width:980px; display:grid; gap:18px;
        grid-template-columns:1.05fr .95fr;}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  .card{
    background:linear-gradient(180deg,#0c1434cc,#0a0f26cc);
    border:1px solid var(--border); border-radius:18px; padding:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.45), inset 0 0 0 1px #ffffff08;
    backdrop-filter:blur(6px);
  }
  .title{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
  .title .dot{width:10px;height:10px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#7dd3fc,#3b82f6 60%,#1d4ed8)}
  .title h1{font-size:20px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin:0 0 6px}
  label{display:block;font-size:12px;color:#b6c5db;margin:10px 0 6px}
  input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
    background:#0b1230;color:var(--ink);outline:none;}
  input:focus,select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px #3b82f633}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  button{
    padding:12px 14px;border:none;border-radius:12px;cursor:pointer;font-weight:600;
    background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff;
    box-shadow:0 10px 24px rgba(59,130,246,.35);
  }
  button.secondary{background:#0b1230;color:#dbeafe;border:1px solid #233361;box-shadow:none}
  .preview{display:grid;place-items:center;min-height:420px;padding:16px;
    border:1px dashed var(--border);border-radius:18px;background:#070b1a;}
  .qr-frame{width:min(92vw,360px);aspect-ratio:1/1;border:0;border-radius:14px;background:#0b1230;}
  .hint{font-size:12px;color:#8aa0bf}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title"><span class="dot"></span><h1>No-JS QR Generator</h1></div>
      <p class="sub">Powered by api.qrserver.com • Works without JavaScript</p>

      <form action="https://api.qrserver.com/v1/create-qr-code/"
            method="get" target="qrpreview" style="display:grid;gap:8px">

        <label for="data">Text / URL</label>
        <input id="data" name="data" type="text" placeholder="https://example.com or any text" required>

        <div class="row">
          <div>
            <label for="size">Size (e.g. 512x512)</label>
            <input id="size" name="size" type="text"
                   title="Enter widthxheight, e.g. 512x512"
                   pattern="[0-9]{2,4}\s*[xX×]\s*[0-9]{2,4}"
                   value="320x320" required>
          </div>
          <div>
            <label for="margin">Quiet Zone / Margin</label>
            <input id="margin" name="margin" type="number" min="0" max="20" value="2">
          </div>
        </div>

        <div class="row-3">
          <div>
            <label for="ecc">Error Correction</label>
            <select id="ecc" name="ecc">
              <option value="L">L (~7%)</option>
              <option value="M" selected>M (~15%)</option>
              <option value="Q">Q (~25%)</option>
              <option value="H">H (~30%)</option>
            </select>
          </div>
          <div>
            <label for="format">Format</label>
            <select id="format" name="format">
              <option value="png" selected>PNG</option>
              <option value="jpg">JPG</option>
              <option value="gif">GIF</option>
              <option value="svg">SVG</option>
            </select>
          </div>
          <div>
            <label for="bgcolor">Background (hex)</label>
            <input id="bgcolor" name="bgcolor" type="text"
                   placeholder="ffffff" pattern="[0-9a-fA-F]{6}" value="ffffff">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="color">Foreground (hex)</label>
            <input id="color" name="color" type="text"
                   placeholder="000000" pattern="[0-9a-fA-F]{6}" value="000000">
          </div>
          <div>
            <label>Presets (tap to preview)</label>
            <div class="row" style="grid-template-columns:1fr 1fr;gap:8px">
              <button type="submit" class="secondary"
                formaction="https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=Hello%20World&margin=2&ecc=Q&color=000000&bgcolor=ffffff"
                formtarget="qrpreview">Hello</button>
              <button type="submit" class="secondary"
                formaction="https://api.qrserver.com/v1/create-qr-code/?size=512x512&data=https%3A%2F%2Fexample.com&margin=4&ecc=H&color=0a0a0a&bgcolor=f1f5f9"
                formtarget="qrpreview">Link</button>
            </div>
          </div>
        </div>

        <div class="btns">
          <button type="submit">Preview</button>
          <button type="submit" class="secondary" formtarget="_blank">Open Image</button>
        </div>
        <div class="hint">Tip: To download, click “Open Image” and save from the new tab.</div>
      </form>
    </div>

    <div class="card">
      <div class="preview">
        <iframe name="qrpreview"
                class="qr-frame"
                title="QR Preview"
                src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=https%3A%2F%2Fexample.com&margin=2&ecc=M&color=000000&bgcolor=ffffff"
                loading="lazy"
                referrerpolicy="no-referrer"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
